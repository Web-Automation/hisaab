<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hisaab | Money dashboard</title>
  <meta name="description" content="Income, spends, investments, liabilities and tax in one place.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232B55D6'/%3E%3Ctext x='16' y='23.5' font-size='20' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='white'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    /* Apply the saved theme before first paint to avoid a flash */
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('hisaab.theme'));
        if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"><p style="padding:24px;font-family:sans-serif">Loading your dashboard. This page needs JavaScript turned on.</p></div>
  <div id="tip" class="tip" role="tooltip"></div>
  <div id="modal-root"></div>

  <!-- Classic scripts (not modules) so the site also opens by double-clicking index.html -->
  <script src="config.js"></script>
  <script src="util.js"></script>
  <script src="tax.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
